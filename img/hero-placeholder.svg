    <circle cx="570" cy="70" r="4"/>
    <circle cx="70" cy="450" r="4"/>
    <circle cx="570" cy="450" r="4"/>
  </g>
  <text x="320" y="252" text-anchor="middle" font-family="monospace" font-size="20" fill="#8FE3B4">IMAGEM DE DESTAQUE</text>
  <text x="320" y="280" text-anchor="middle" font-family="monospace" font-size="14" fill="#5C9E7B">substitua img/hero-placeholder.svg pela sua imagem</text>
